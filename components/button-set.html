<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button set</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f8;
        }

        h2 {
            color: #263b5e;
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #007bff;
            color: #fff;
        }

        .btn-send {
            background-color: #28a745;
            color: #fff;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: #fff;
        }

        .btn-outline {
            background-color: white;
            border: 2px solid #007bff;
        }

        .btn-primary:hover {
            background-color: navy;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-outline:hover {
            background-color: rgba(38, 59, 94, 0.15);
        }

        .btn-send:hover {
            background-color: chocolate;
        }
    </style>
</head>
<body>
    <main>
        <h2>Normal</h2>

        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat proyek</a>
            <a href="#" class="btn btn-secondary">unduh cv</a>
            <a href="#" class="btn btn-outline">Hubungi saya</a>
            <a href="#" class="btn btn-send">Kirim pesan</a>
        </div>
    </main>

     <a
                href="../index.html"
                style="color: darkblue; font-size: 14px;"
            >
                Kembali ke Beranda
            </a>
</body>
</html>
