<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button set</title>

    <style>
        /* mengatur gaya */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f8;
        }

        h2 {
            color: #263b5e;
            font-size: 20px;
        }

        /* pemasangan button */

        .btn {
            display: inline-block;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #007bff;
            color: #fff;
        }

        .btn-send {
            background-color: #28a745;
            color: #fff;
        }

        .btn-secondary, .btn-outline {
            color: #212529;
        }
        .btn-secondary {
            background-color: #a7c7e7;
        }
        .btn-outline {
            background-color: white;
            border: 2px solid #007bff;
        }

        .btn-primary:hover {
            background-color: navy;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-outline:hover {
            background-color: rgba(38, 59, 94, 0.15);
        }

        .btn-send:hover {
            background-color: rgb(0, 128, 0);
        }
    </style>
</head>
<body>
    <main>

        <h2>Normal</h2>

        <!-- memberikan tujuan tombol ketika dipencet -->

        <div class="button-group">
            <a href="../pages/gallery.html" class="btn btn-primary">Lihat proyek</a>
            <a href="../components/card-badge.html" class="btn btn-secondary">Kartu</a>
            <a href="../pages/contact.html" class="btn btn-outline">Hubungi saya</a>
            <a href="../pages/about.html" class="btn btn-send">Tentang Saya</a>
        </div>
    </main>
    <footer>
     <a
                href="../index.html"
            >
                Kembali ke Beranda
            </a>
    </footer>
</body>
</html>
