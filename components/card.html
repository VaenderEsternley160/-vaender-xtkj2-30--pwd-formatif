<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kartu Proyek</title>

    <style>
        /*320px + 40px padding + 4px border = 364px*/
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #263b5e;
            margin: 30px auto;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
        }

        .card h3 {
            color: #263b5e;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
        }

        .card a {
            color: #e58b38;
        }

        footer {
            text-align: center;
        }
    </style>
</head>

<body>

    <main>
        <div class="card">
            <img src="/assets/images/TOKO.jpg" alt="Gambar proyek">

            <h3>Website Toko Vaender</h3>

            <p>
                Proyek latihan membuat halaman toko sederhana.
                Dibuat memakai HTML dan CSS.
            </p>

            <a href="../project/toko.html">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
