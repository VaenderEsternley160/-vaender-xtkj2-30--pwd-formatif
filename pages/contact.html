<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    body {
      background-color: #f5f7fa;
      font-family: "Poppins", Arial, sans-serif;
      margin: 0;
    }

    #contact {
      padding: 40px 20px;
    }

    .contact-form {
      width: 400px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid #243b66;
      border-radius: 10px;
      background-color: #ffffff;
    }

    .contact-form h2 {
      text-align: center;
      color: #1f2d4d;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #cbd2dc;
      border-radius: 6px;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      background-color: #dfe6f1;
      border-color: #243b66;
      outline: none;
    }

    .btn-submit {
      background-color: #243b66;
      color: #ffffff;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: gray;
    }
  </style>
</head>
<body>
  <section id="contact">
    <form class="contact-form">
      <h2>Hubungi Saya</h2>

      <div class="form-group">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>

      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="4"></textarea>
      </div>

      <button type="submit" class="btn-submit">Kirim Pesan</button>
    </form>
  </section>

  <p style="text-align: center;"><a href="../index.html">Kembali ke Beranda</a></p>
</body>
</html>
